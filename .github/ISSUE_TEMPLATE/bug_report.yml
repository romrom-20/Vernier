name: Bug report
description: Reproduce a native interaction, storage or connector problem with synthetic data.
body:
  - type: markdown
    attributes:
      value: Please remove private conversations, credentials, workspace paths and personal screenshots. Security vulnerabilities belong in the private security reporting channel.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Swift/Xcode version, app revision, display setup if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Prefer Scripts/showcase.sh. Include pointer entry/exit, click or drag steps for pill issues.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks and safe evidence
      description: Test output or a synthetic-only screenshot. Specify what you tried manually.
